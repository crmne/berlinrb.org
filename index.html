<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Berlin.rb</title>
    <meta name="description" content="Berlin.rb is coming soon.">
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://stats.paolino.me/js/pa-qYMtzApqYH7-B10ozGrEh.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
    <style>
      :root {
        color-scheme: light;
        --ink: #171717;
        --muted: #69665f;
        --paper: #fbfaf7;
        --ruby: #c7162b;
        --gold: #f2c94c;
        --line: rgba(23, 23, 23, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(199, 22, 43, 0.08), transparent 36%),
          linear-gradient(315deg, rgba(242, 201, 76, 0.18), transparent 42%),
          var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(100% - 40px, 720px);
        padding: 72px 0;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 72px;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      .ruby {
        width: 32px;
        height: 32px;
        transform: rotate(45deg);
        border-radius: 6px;
        background: var(--ruby);
        box-shadow: inset -8px -8px 0 rgba(0, 0, 0, 0.12);
      }

      .panel {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: clamp(42px, 8vw, 76px) 0;
      }

      h1 {
        margin: 0;
        max-width: 620px;
        font-size: clamp(3rem, 10vw, 6.6rem);
        font-weight: 800;
        line-height: 0.92;
        letter-spacing: 0;
      }

      p {
        margin: 28px 0 0;
        max-width: 520px;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.25rem);
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
        margin-top: 34px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .footer span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .footer span::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        content: "";
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <span class="ruby" aria-hidden="true"></span>
        <span>Berlin.rb</span>
      </div>

      <section class="panel" aria-labelledby="title">
        <h1 id="title">Coming soon.</h1>
        <p>Ruby people in Berlin. A new home for meetups, talks, and community notes is on the way.</p>
      </section>

      <div class="footer">
        <span>berlinrb.org</span>
        <span>hello@berlinrb.org</span>
      </div>
    </main>
  </body>
</html>
